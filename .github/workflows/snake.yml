name: Generate Snake

on:
  # Запуск каждые 24 часа
  schedule:
    - cron: "0 0 * * *"
  
  # Возможность запустить вручную из вкладки Actions
  workflow_dispatch:
  
  # Запуск при каждом пуше в ветку main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Генерирует змейку на основе вкладов пользователя XSimargl
      - name: generate-github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: XSimargl
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Пушит результат в специальную ветку "output", откуда README забирает картинку
      - name: push github-contribution-grid-snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
